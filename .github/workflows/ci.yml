name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (warnings as errors)
        run: dotnet build Alfred.sln -warnaserror

      - name: Test with coverage gate
        run: dotnet test tests/Alfred.Functions.Tests/Alfred.Functions.Tests.csproj --no-build /p:CollectCoverage=true
