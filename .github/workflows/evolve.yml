name: evolve

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "What to change about Alfred"
        required: true
        type: string

permissions:
  contents: write

# One self-modification at a time
concurrency:
  group: evolve
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code on the instruction
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          claude -p "You are modifying Alfred, the personal-assistant Azure Functions app in this repo. Read CLAUDE.md first for the architecture and conventions. Matthew sent this instruction from Telegram: ${INSTRUCTION}. Make the change. Keep the build warning-free, follow existing code style, and update CLAUDE.md if behavior or settings change. Do NOT commit, push, or deploy - the pipeline handles those." --dangerously-skip-permissions

      - name: Build
        run: |
          dotnet build src/Alfred.Functions/Alfred.Functions.csproj -warnaserror
          dotnet build tools/TestHarness/TestHarness.csproj -warnaserror
          dotnet publish src/Alfred.Functions/Alfred.Functions.csproj -c Release -o ./publish_output

      - name: Commit and push
        env:
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          git config user.name "Alfred Evolve"
          git config user.email "alfred-evolve@users.noreply.github.com"
          git add -A ':!publish_output'
          if git diff --cached --quiet; then
            echo "No changes produced" && exit 1
          fi
          git commit -m "evolve: ${INSTRUCTION}" -m "Automated self-modification via /evolve from Telegram.

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: func-matt-scerri-alfred-prod-westeu-001
          package: ./publish_output
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

      - name: Notify Telegram (success)
        if: success()
        env:
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          FILES=$(git diff-tree --no-commit-id --name-only -r HEAD | head -10)
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="Done and deployed (${COMMIT}): ${INSTRUCTION}

          Files changed:
          ${FILES}"

      - name: Notify Telegram (failure)
        if: failure()
        env:
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="Couldn't complete the change: ${INSTRUCTION} - nothing was deployed. Check the GitHub Actions log for details."
