name: evolve

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "What to change about Alfred"
        required: true
        type: string
      model:
        description: "Claude model for the coding session (sonnet is ~2.5x cheaper; pick opus for big or delicate features)"
        required: false
        type: choice
        default: sonnet
        options:
          - sonnet
          - opus

permissions:
  contents: write

# One self-modification at a time
concurrency:
  group: evolve
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Feature-sized instructions legitimately run 30-60+ minutes (coding pass, test-writer
      # subagent, coverage gate, adversarial review). The timeout catches a genuinely hung
      # session and fails the run so the Telegram failure notification fires; stream-json
      # through the filter makes progress visible live instead of buffering until the end.
      # Sonnet by default: coding sessions are the app's single biggest credit burner
      # (an hour-long Opus session costs real money), and Sonnet handles this codebase
      # fine. The model input allows opting a big feature into opus.
      - name: Run Claude Code on the instruction
        timeout-minutes: 90
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTRUCTION: ${{ inputs.instruction }}
          MODEL: ${{ inputs.model || 'sonnet' }}
        run: |
          set -o pipefail
          claude -p "You are modifying Alfred, the personal-assistant Azure Functions app in this repo. Read CLAUDE.md first for the architecture and conventions. Matthew sent this instruction from Telegram: ${INSTRUCTION}. Make the change. Keep the build warning-free, follow existing code style, and update CLAUDE.md if behavior or settings change. Follow the 'Testing & merge rules' in CLAUDE.md: as the coding agent you must NOT modify anything under tests/ or the coverage gate; if the change needs new or updated tests, dispatch a subagent in the test-writer role (see .claude/agents/test-writer.md) which touches ONLY tests/. Before finishing, dispatch a subagent in the adversarial-reviewer role (see .claude/agents/adversarial-reviewer.md) to review your full change set and address its findings. All tests must pass before you finish. Do NOT commit, push, or deploy - the pipeline handles those." --model "${MODEL}" --dangerously-skip-permissions --output-format stream-json --verbose \
            | jq -rR --unbuffered -f .github/scripts/evolve-stream-filter.jq

      - name: Build
        run: |
          dotnet build src/Alfred.Functions/Alfred.Functions.csproj -warnaserror
          dotnet build tools/TestHarness/TestHarness.csproj -warnaserror
          dotnet publish src/Alfred.Functions/Alfred.Functions.csproj -c Release -o ./publish_output

      - name: Test (coverage gate)
        run: dotnet test tests/Alfred.Functions.Tests/Alfred.Functions.Tests.csproj -warnaserror /p:CollectCoverage=true

      - name: Commit and push
        env:
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          git config user.name "Alfred Evolve"
          git config user.email "alfred-evolve@users.noreply.github.com"
          git add -A ':!publish_output'
          if git diff --cached --quiet; then
            # No diff (e.g. verify-only instruction or a rerun) — still deploy current main
            echo "No changes produced; skipping commit"
          else
            git commit -m "evolve: ${INSTRUCTION}" -m "Automated self-modification via /evolve from Telegram.

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
            git push
          fi

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: func-matt-scerri-alfred-prod-westeu-001
          package: ./publish_output
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

      - name: Notify Telegram (success)
        if: success()
        env:
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          FILES=$(git diff-tree --no-commit-id --name-only -r HEAD | head -10)
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="Done and deployed (${COMMIT}): ${INSTRUCTION}

          Files changed:
          ${FILES}"

      - name: Notify Telegram (failure)
        if: failure()
        env:
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="Couldn't complete the change: ${INSTRUCTION} - nothing was deployed. Check the GitHub Actions log for details (a run cut off at the 90-minute limit shows up here too)."

      # Manual cancellation skips the failure step (cancelled != failure), which used to
      # mean total silence in Telegram — say so explicitly instead
      - name: Notify Telegram (cancelled)
        if: cancelled()
        env:
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="Cancelled mid-run: ${INSTRUCTION} - nothing was committed or deployed. The session's live progress streams into the Actions log now; feature-sized changes can legitimately take 30-60+ minutes."
